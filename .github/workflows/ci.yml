name: CI

# Fast suite gating every PR and every push to main (Ways of Working §6,
# Test Strategy §7): install -> lint -> typecheck -> unit/integration tests
# (against an ephemeral Postgres) -> build -> funnel e2e (mocked grading
# provider) -> a golden-set regression job that is a PLACEHOLDER and
# validates nothing yet (see grading-regression.yml).
# deploy-website.yml / deploy-cms.yml require a successful run of this
# workflow for the commit being deployed before they'll run.

on:
  pull_request:
    # Stacked branches are the working pattern here, so PRs that target another
    # feature branch must run CI too — `branches: [main]` alone would skip them.
    branches: [main, 'chore/**', 'feature/**']
    # No paths filter: deploy workflows and CI config are as worth gating as
    # app code, and a PR editing the file that contains the verify-ci gate
    # previously ran no CI at all.
  push:
    branches: [main]
    # No paths filter here either, and for a sharper reason: deploys require a
    # successful ci.yml run for the exact SHA being deployed. A docs-only
    # commit that matched no path produced no run, so main became undeployable
    # until someone manually dispatched CI.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs. On main, two merges in quick succession
  # would cancel the first — conclusion `cancelled`, not `success` — and that
  # commit could then never be deployed, even after the fact.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: checkout persists this token into .git/config, and the job
# then runs npm lifecycle scripts from the PR branch.
permissions:
  contents: read

jobs:
  website:
    name: Website — lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        # Exact version, matching docker-compose.yml. See
        # website/src/lib/db/postgres-version.ts.
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: fluentina
          POSTGRES_USER: fluentina
          POSTGRES_PASSWORD: fluentina_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluentina -d fluentina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://fluentina:fluentina_ci@localhost:5432/fluentina
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Lint
        working-directory: website
        run: npm run lint

      - name: Typecheck
        working-directory: website
        run: npm run typecheck

      # The data-layer tests query a real Postgres, so the schema has to exist
      # before they run. KAN-10 added the first migration; without this step the
      # suite fails with "schema does not exist" rather than on anything about
      # the code.
      - name: Apply database migrations
        working-directory: website
        run: npm run db:migrate

      # Fails the build when someone edits the schema and does not generate the
      # matching migration. Without it the two drift, CI stays green because the
      # tests run against whatever the migrations produced, and the divergence
      # is found in production.
      #
      # Two failure modes this used to miss, both closed below:
      #   - `drizzle-kit generate` exits 0 even when it bails out. A rename it
      #     can't resolve unambiguously normally prompts interactively; with no
      #     TTY (every CI runner) that prompt throws internally instead, but the
      #     process still exits 0 — and `git diff --exit-code` on an untouched
      #     working tree then also passes, green, having generated nothing and
      #     checked nothing. Stdin is piped from /dev/null so a stray prompt
      #     fails fast instead of hanging, and the log is grepped for the
      #     failure instead of trusting the exit code.
      #   - `git diff` only ever sees drift in files git already tracks. A
      #     genuinely new migration and its snapshot are untracked, so a real
      #     schema change with no matching migration at all produced an empty
      #     `git diff` and this step still passed. `git status --porcelain`
      #     covers untracked files too.
      - name: Migrations match the schema
        working-directory: website
        timeout-minutes: 2
        run: |
          set -o pipefail
          npx drizzle-kit generate < /dev/null 2>&1 | tee /tmp/drizzle-generate.log
          if grep -qi '^Error' /tmp/drizzle-generate.log; then
            echo "::error::drizzle-kit generate did not complete cleanly (see log above) — treating as drift rather than trusting its exit code."
            exit 1
          fi
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema and checked-in migrations have drifted — drizzle-kit generate produced changes (tracked or untracked) that are not committed:"
            git status --porcelain drizzle
            exit 1
          fi

      - name: Unit & integration tests
        working-directory: website
        # Vitest — includes the security/ownership/consent/rate-limit
        # integration suite (Test Strategy §4) once those stories land, run
        # against the Postgres service container above, never a shared DB.
        run: npm run test

      - name: Build
        working-directory: website
        env:
          NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PUBLIC_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY: ''
        run: npm run build

      - name: Install Playwright browsers
        working-directory: website
        # Desktop + mobile Chromium, plus WebKit (KAN-30) — Safari's engine,
        # and the default browser on every iPhone, so the guest flow's
        # cookie-dependent path needs real coverage here, not only locally.
        # WebKit refuses the `__Host-`-prefixed session cookie (any `Secure`
        # cookie, in fact) over a plain HTTP connection, even on localhost —
        # see tests/guest-session.spec.ts's own comment for the probe that
        # established this — which is exactly why this job now serves the
        # built app through scripts/tls-proxy.mjs's self-signed TLS proxy
        # below rather than plain HTTP: without it, WebKit here would still
        # skip the twelve tests, per WebKit project, conditioned on the
        # connection being encrypted (six in tests/guest-session.spec.ts,
        # four in tests/essay-entry.spec.ts, two in tests/word-count.spec.ts
        # — see each file's own comment, and the comment above
        # playwright.config.ts's HTTPS-in-CI throw for the count) for the
        # same reason it used to when this job only ran Chromium.
        run: npx playwright install --with-deps chromium webkit

      - name: Generate self-signed TLS certificate
        working-directory: website
        # One-day, throwaway — lives only for this job. See
        # scripts/generate-tls-cert.sh's own comment for why a self-signed
        # cert is sufficient here (measured, not assumed): Safari stores our
        # session cookie over an encrypted connection even when the
        # certificate itself is untrusted. `ignoreHTTPSErrors: true` in
        # playwright.config.ts is what lets every project — not just
        # WebKit — connect through it at all.
        run: npm run tls:generate-cert -- .tls

      - name: Start built app
        working-directory: website
        env:
          # Must be on the SERVER, not just the test runner: once KAN-14 lands,
          # grading is a server-side fetch that Playwright cannot intercept.
          MOCK_GRADING_PROVIDER: '1'
        run: |
          npm run start -- -p 3000 &
          echo $! > /tmp/next-server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time" >&2
          exit 1

      - name: Start TLS proxy in front of the built app
        working-directory: website
        env:
          TLS_PROXY_PORT: '8443'
          TLS_PROXY_TARGET_PORT: '3000'
          TLS_PROXY_CERT: .tls/localhost-cert.pem
          TLS_PROXY_KEY: .tls/localhost-key.pem
        run: |
          node scripts/tls-proxy.mjs &
          echo $! > /tmp/tls-proxy.pid
          for i in $(seq 1 30); do
            if curl -sfk https://localhost:8443 > /dev/null; then
              echo "TLS proxy is up"
              exit 0
            fi
            sleep 1
          done
          echo "TLS proxy did not become ready in time" >&2
          exit 1

      # Named for what it actually runs: the marketing regression suite, plus
      # — as of KAN-14 — the first funnel spec (tests/essay-entry.spec.ts,
      # guest essay entry end to end; see CONTRIBUTING.md's own note on this)
      # — and, as of KAN-15, the second: tests/word-count.spec.ts, the live
      # word-count guidance/warning/block states end to end. Neither is
      # tagged @cms, so both run here alongside everything else.
      # MOCK_GRADING_PROVIDER has no consumer in the repo today.
      #
      # @cms specs are excluded: they need a reachable Strapi with published
      # content, and no CMS runs in this job. Without this the suite is red on
      # day one for reasons unrelated to any PR, which is how a pipeline gets
      # deleted or marked continue-on-error. They still run against a live site
      # via `npm run test:e2e:live`.
      #
      # BASE_URL points through the TLS proxy above (KAN-30), not straight at
      # the app on :3000 — see that step's own comment for why. `webkit-desktop`
      # is a required project here, not an optional local-only extra: it's
      # what closes the gap KAN-30 existed for (Safari, unexercised by any PR
      # gate before it). KAN-33 added `webkit-mobile` alongside it, for the
      # gap that remained after that: everything iPhone-shaped that isn't the
      # cookie (viewport-differential rendering under a real Safari engine —
      # see tests/guest-flow.spec.ts) — chromium-mobile was, until then, the
      # only mobile signal in the suite, a different engine entirely.
      #
      # No `--project` flags here (KAN-30 round-2 review, Test Lead): the
      # project list comes from playwright.config.ts alone, which is where
      # the guard that stops `--grep-invert "@cms"` from re-admitting CMS
      # specs *also* lives (the config's own `projects` array). Naming
      # chromium-desktop/chromium-mobile/webkit-desktop/webkit-mobile
      # explicitly here meant a future edit or merge resolution could drop
      # one of the flags and the job would stay green with a silent coverage
      # loss — no error, nothing — the exact silent-drift shape the throw two
      # steps up exists to close for the protocol, just one layer higher: for
      # the project itself instead of the connection it runs over. Dropping a
      # project now requires editing playwright.config.ts, same file, so both
      # guards sit together. Verified this changes nothing about what runs:
      # config's `projects` array is exactly these four and no more, and
      # `--list --grep-invert "@cms"` reports the identical 470 tests with
      # and without the flags (KAN-33: down from 561 across three projects —
      # playwright.config.ts's own `REQUEST_ONLY_SPECS` now excludes
      # seo/redirects/routing/sitemap.spec.ts from every project but
      # chromium-desktop, so they execute once each instead of once per
      # project — see that file's own comment and CONTRIBUTING.md).
      - name: E2E (Playwright, no CMS)
        working-directory: website
        env:
          BASE_URL: https://localhost:8443
          MOCK_GRADING_PROVIDER: '1'
          # This job owns the server lifecycle (Start/Stop steps above), so
          # Playwright must not also try to start one — see playwright.config.ts.
          PLAYWRIGHT_EXTERNAL_SERVER: '1'
        run: npx playwright test --grep-invert "@cms"

      - name: Stop TLS proxy
        if: always()
        run: kill "$(cat /tmp/tls-proxy.pid)" 2>/dev/null || true

      - name: Stop built app
        if: always()
        run: kill "$(cat /tmp/next-server.pid)" 2>/dev/null || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 7

  cms:
    name: CMS — install & build smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cms/package-lock.json

      - name: Install dependencies
        working-directory: cms
        run: npm ci

      - name: Build
        working-directory: cms
        run: npm run build

  grading-regression:
    # The check name is the only thing a reviewer sees. "AI grading golden-set
    # regression" going green reads as "grading was validated"; nothing is
    # called. Say so where it shows.
    name: AI grading golden-set regression (PLACEHOLDER — validates nothing yet)
    needs: [website]
    uses: ./.github/workflows/grading-regression.yml
    # Explicit, not `secrets: inherit`. Inherit exposed GCP_SA_KEY_BASE64,
    # STRIPE_SECRET_KEY and the STRAPI_* signing secrets to a called workflow
    # on every PR run, pre-merge.
    secrets:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
