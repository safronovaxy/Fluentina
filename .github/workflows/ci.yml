name: CI

# Fast suite gating every PR and every push to main (Ways of Working §6,
# Test Strategy §7): install -> lint -> typecheck -> unit/integration tests
# (against an ephemeral Postgres) -> build -> funnel e2e (mocked grading
# provider) -> a golden-set regression job that is a PLACEHOLDER and
# validates nothing yet (see grading-regression.yml).
# deploy-website.yml / deploy-cms.yml require a successful run of this
# workflow for the commit being deployed before they'll run.
#
# Two test tiers (CLAUDE.md, "Test tiers"):
#   - FULL — the `website` job below: everything, on every event. It is the
#     merge gate and what the deploy workflows' verify-ci looks for.
#   - SMOKE — the `website-smoke` job: only the tests the diff selects
#     (website/scripts/test-tiers.ts), chromium-desktop only, PRs only. It is
#     an additional, faster signal and gates nothing.
# The split is staged. This is stage 1: nothing that gates merge got weaker,
# so there is no wall-clock saving on the gate yet either. Stage 2 (make the
# full job conditional on PRs) needs a branch-protection change first — a job
# skipped by `if:` reports success to a required check, so flipping it without
# that change would silently remove the gate.

on:
  pull_request:
    # Stacked branches are the working pattern here, so PRs that target another
    # feature branch must run CI too — `branches: [main]` alone would skip them.
    branches: [main, 'chore/**', 'feature/**']
    # No paths filter: deploy workflows and CI config are as worth gating as
    # app code, and a PR editing the file that contains the verify-ci gate
    # previously ran no CI at all.
  push:
    branches: [main]
    # No paths filter here either, and for a sharper reason: deploys require a
    # successful ci.yml run for the exact SHA being deployed. A docs-only
    # commit that matched no path produced no run, so main became undeployable
    # until someone manually dispatched CI.
  # A daily full run of main, so drift nobody pushed (a dependency, a base
  # image, a flaky order dependence) surfaces on its own. Scheduled workflows
  # only ever run on the default branch. No `paths` filter, for the same
  # reasons as above. Note verify-ci accepts `push` and `workflow_dispatch`
  # runs only, so this run cannot stand in for one when deploying.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  # The scheduled run gets its own group: sharing main's, it could sit in the
  # single "pending" slot and be replaced by, or replace, a push run's.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-scheduled' || '' }}
  # Only cancel superseded PR runs. On main, two merges in quick succession
  # would cancel the first — conclusion `cancelled`, not `success` — and that
  # commit could then never be deployed, even after the fact.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: checkout persists this token into .git/config, and the job
# then runs npm lifecycle scripts from the PR branch.
permissions:
  contents: read

jobs:
  # THE FULL TIER. Runs every test on every event — pull_request, push to
  # main, schedule, workflow_dispatch — with no `if:` on purpose:
  #   - pushes to main must always run full, because deploy-website.yml and
  #     deploy-cms.yml's verify-ci requires THIS job to have succeeded for the
  #     exact SHA (by job name, see FULL_JOB there), so a smoke run can never
  #     satisfy the deploy gate;
  #   - on PRs it is the required check that gates merge.
  # The `name:` is that contract, and it lives in FOUR places, only two of
  # which a test can see: this file and the FULL_JOB constant in both deploy
  # workflows' verify-ci (scripts/ci-workflows.test.ts fails if those
  # disagree), plus the branch-protection required check, which is repo
  # settings and invisible to any test. The test does latch it: it asserts this
  # name equals the one recorded in .github/required-checks.json, so renaming
  # the job forces a touch of the file that says "change branch protection in
  # lockstep" (an Administration-scoped manual change). The latch cannot verify
  # that the change was made.
  website:
    name: Website — lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        # Exact version, matching docker-compose.yml. See
        # website/src/lib/db/postgres-version.ts.
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: fluentina
          POSTGRES_USER: fluentina
          POSTGRES_PASSWORD: fluentina_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluentina -d fluentina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://fluentina:fluentina_ci@localhost:5432/fluentina
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Lint
        working-directory: website
        run: npm run lint

      - name: Typecheck
        working-directory: website
        run: npm run typecheck

      # The data-layer tests query a real Postgres, so the schema has to exist
      # before they run. KAN-10 added the first migration; without this step the
      # suite fails with "schema does not exist" rather than on anything about
      # the code.
      - name: Apply database migrations
        working-directory: website
        run: npm run db:migrate

      # Fails the build when someone edits the schema and does not generate the
      # matching migration. Without it the two drift, CI stays green because the
      # tests run against whatever the migrations produced, and the divergence
      # is found in production.
      #
      # Two failure modes this used to miss, both closed below:
      #   - `drizzle-kit generate` exits 0 even when it bails out. A rename it
      #     can't resolve unambiguously normally prompts interactively; with no
      #     TTY (every CI runner) that prompt throws internally instead, but the
      #     process still exits 0 — and `git diff --exit-code` on an untouched
      #     working tree then also passes, green, having generated nothing and
      #     checked nothing. Stdin is piped from /dev/null so a stray prompt
      #     fails fast instead of hanging, and the log is grepped for the
      #     failure instead of trusting the exit code.
      #   - `git diff` only ever sees drift in files git already tracks. A
      #     genuinely new migration and its snapshot are untracked, so a real
      #     schema change with no matching migration at all produced an empty
      #     `git diff` and this step still passed. `git status --porcelain`
      #     covers untracked files too.
      - name: Migrations match the schema
        working-directory: website
        timeout-minutes: 2
        run: |
          set -o pipefail
          npx drizzle-kit generate < /dev/null 2>&1 | tee /tmp/drizzle-generate.log
          if grep -qi '^Error' /tmp/drizzle-generate.log; then
            echo "::error::drizzle-kit generate did not complete cleanly (see log above) — treating as drift rather than trusting its exit code."
            exit 1
          fi
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema and checked-in migrations have drifted — drizzle-kit generate produced changes (tracked or untracked) that are not committed:"
            git status --porcelain drizzle
            exit 1
          fi

      - name: Unit & integration tests
        working-directory: website
        # Vitest — includes the security/ownership/consent/rate-limit
        # integration suite (Test Strategy §4) once those stories land, run
        # against the Postgres service container above, never a shared DB.
        run: npm run test

      - name: Build
        working-directory: website
        env:
          NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PUBLIC_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY: ''
        run: npm run build

      - name: Install Playwright browsers
        working-directory: website
        # Desktop + mobile Chromium, plus WebKit on BOTH desktop and mobile
        # (KAN-30 added webkit-desktop; KAN-33 added webkit-mobile) — Safari's
        # engine,
        # and the default browser on every iPhone, so the guest flow's
        # cookie-dependent path needs real coverage here, not only locally.
        # WebKit refuses the `__Host-`-prefixed session cookie (any `Secure`
        # cookie, in fact) over a plain HTTP connection, even on localhost —
        # see tests/guest-session.spec.ts's own comment for the probe that
        # established this — which is exactly why this job now serves the
        # built app through scripts/tls-proxy.mjs's self-signed TLS proxy
        # below rather than plain HTTP: without it, WebKit here would still
        # skip every test conditioned on the connection being encrypted
        # (see tests/helpers/webkit.ts for the predicate, and grep its call
        # sites for the list — no count here, it goes stale) for the same
        # reason it used to when this job only ran Chromium.
        run: npx playwright install --with-deps chromium webkit

      - name: Generate self-signed TLS certificate
        working-directory: website
        # One-day, throwaway — lives only for this job. See
        # scripts/generate-tls-cert.sh's own comment for why a self-signed
        # cert is sufficient here (measured, not assumed): Safari stores our
        # session cookie over an encrypted connection even when the
        # certificate itself is untrusted. `ignoreHTTPSErrors: true` in
        # playwright.config.ts is what lets every project — not just
        # WebKit — connect through it at all.
        run: npm run tls:generate-cert -- .tls

      - name: Start built app
        working-directory: website
        env:
          # Must be on the SERVER, not just the test runner: once KAN-14 lands,
          # grading is a server-side fetch that Playwright cannot intercept.
          MOCK_GRADING_PROVIDER: '1'
        run: |
          npm run start -- -p 3000 &
          echo $! > /tmp/next-server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time" >&2
          exit 1

      - name: Start TLS proxy in front of the built app
        working-directory: website
        env:
          TLS_PROXY_PORT: '8443'
          TLS_PROXY_TARGET_PORT: '3000'
          TLS_PROXY_CERT: .tls/localhost-cert.pem
          TLS_PROXY_KEY: .tls/localhost-key.pem
        run: |
          node scripts/tls-proxy.mjs &
          echo $! > /tmp/tls-proxy.pid
          for i in $(seq 1 30); do
            if curl -sfk https://localhost:8443 > /dev/null; then
              echo "TLS proxy is up"
              exit 0
            fi
            sleep 1
          done
          echo "TLS proxy did not become ready in time" >&2
          exit 1

      # Named for what it actually runs: the marketing regression suite, plus
      # — as of KAN-14 — the first funnel spec (tests/essay-entry.spec.ts,
      # guest essay entry end to end; see CONTRIBUTING.md's own note on this)
      # — and, as of KAN-15, the second: tests/word-count.spec.ts, the live
      # word-count guidance/warning/block states end to end. Neither is
      # tagged @cms, so both run here alongside everything else.
      # MOCK_GRADING_PROVIDER now has a real consumer, as of KAN-16:
      # `provider-factory.ts`'s `createGradingProvider()` selects the fake,
      # zero-network-call provider whenever this is exactly "1" — set here,
      # on the SERVER (the "Start built app" step above), and again for the
      # Vitest unit suite itself as the config-level default in
      # vitest.config.ts, not here (KAN-16 round-1 review, finding 1 — a
      # value set only in `ci.yml` would leave the unit suite depending on a
      # gitignored `.env.local` for the same thing, which is what let this
      # exact suite pass locally and fail in CI the first time it existed).
      #
      # @cms specs are excluded: they need a reachable Strapi with published
      # content, and no CMS runs in this job. Without this the suite is red on
      # day one for reasons unrelated to any PR, which is how a pipeline gets
      # deleted or marked continue-on-error. They still run against a live site
      # via `npm run test:e2e:live`.
      #
      # BASE_URL points through the TLS proxy above (KAN-30), not straight at
      # the app on :3000 — see that step's own comment for why. `webkit-desktop`
      # is a required project here, not an optional local-only extra: it's
      # what closes the gap KAN-30 existed for (Safari, unexercised by any PR
      # gate before it). KAN-33 added `webkit-mobile` alongside it, for the
      # gap that remained after that: everything iPhone-shaped that isn't the
      # cookie (viewport-differential rendering under a real Safari engine —
      # see tests/guest-flow.spec.ts) — chromium-mobile was, until then, the
      # only mobile signal in the suite, a different engine entirely.
      #
      # No `--project` flags here (KAN-30 round-2 review, Test Lead): the
      # project list comes from playwright.config.ts alone, which is where
      # the guard that stops `--grep-invert "@cms"` from re-admitting CMS
      # specs *also* lives (the config's own `projects` array). Naming
      # chromium-desktop/chromium-mobile/webkit-desktop/webkit-mobile
      # explicitly here meant a future edit or merge resolution could drop
      # one of the flags and the job would stay green with a silent coverage
      # loss — no error, nothing — the exact silent-drift shape the throw two
      # steps up exists to close for the protocol, just one layer higher: for
      # the project itself instead of the connection it runs over. Dropping a
      # project now requires editing playwright.config.ts, same file, so both
      # guards sit together. Verified this changes nothing about what runs:
      # config's `projects` array is exactly these four and no more, and
      # `--list --grep-invert "@cms"` reports the identical 470 tests (as measured
      # for KAN-33; 526 at aa58e70 — 202 chromium-desktop, 108 in each other
      # project) with
      # and without the flags (KAN-33: down from 561 across three projects —
      # playwright.config.ts's own `REQUEST_ONLY_SPECS` now excludes
      # seo/redirects/routing/sitemap.spec.ts from every project but
      # chromium-desktop, so they execute once each instead of once per
      # project — see that file's own comment and CONTRIBUTING.md).
      - name: E2E (Playwright, no CMS)
        working-directory: website
        env:
          BASE_URL: https://localhost:8443
          MOCK_GRADING_PROVIDER: '1'
          # This job owns the server lifecycle (Start/Stop steps above), so
          # Playwright must not also try to start one — see playwright.config.ts.
          PLAYWRIGHT_EXTERNAL_SERVER: '1'
        run: npx playwright test --grep-invert "@cms"

      - name: Stop TLS proxy
        if: always()
        run: kill "$(cat /tmp/tls-proxy.pid)" 2>/dev/null || true

      - name: Stop built app
        if: always()
        run: kill "$(cat /tmp/next-server.pid)" 2>/dev/null || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 7

  # THE SMOKE TIER — stage 1: additional, not a replacement. The `website` job
  # above still runs the complete suite on every PR push, so nothing that gates
  # merge is weaker; this job only reports sooner (and costs extra runner
  # minutes). It must NOT be made a required check in stage 1 and its green is
  # not a merge signal.
  #
  # Selection happens INSIDE this job, never as a workflow-level `paths:`
  # filter — see the two incidents documented on `pull_request` and `push`
  # above. The job always starts on a PR; what it then runs is decided by
  # website/scripts/select-tests.ts, which fails OPEN: a path it does not
  # recognise, an empty diff, or a diff it cannot compute all select the whole
  # suite. The rules and their tests: website/scripts/test-tiers.ts.
  #
  # Smoke is chromium-desktop only (no mobile, no WebKit). That is exactly why
  # it cannot be the gate: the WebKit cookie coverage only the full job has.
  #
  # The prologue below is a deliberate copy of the `website` job's, minus the
  # WebKit install. Kept as a copy rather than refactored into a shared action
  # so this PR does not touch the job that gates merge; the cost is that the
  # two must be kept in step by hand.
  website-smoke:
    name: Website smoke — selected tests, chromium-desktop only
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: fluentina
          POSTGRES_USER: fluentina
          POSTGRES_PASSWORD: fluentina_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluentina -d fluentina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://fluentina:fluentina_ci@localhost:5432/fluentina
      CI: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs both the PR base and head commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # Writes mode, areas, run_unit, run_e2e, unit_files, e2e_files to the
      # step outputs and the selection, with the reason for any "everything",
      # to the job summary. Metadata only — paths and counts.
      - name: Select tests from the diff
        id: select
        working-directory: website
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx tsx scripts/select-tests.ts --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Lint
        working-directory: website
        run: npm run lint

      - name: Typecheck
        working-directory: website
        run: npm run typecheck

      - name: Apply database migrations
        working-directory: website
        run: npm run db:migrate

      # Same drift check as the full job (see its comment for the two failure
      # modes it closes). Copied verbatim.
      - name: Migrations match the schema
        working-directory: website
        timeout-minutes: 2
        run: |
          set -o pipefail
          npx drizzle-kit generate < /dev/null 2>&1 | tee /tmp/drizzle-generate.log
          if grep -qi '^Error' /tmp/drizzle-generate.log; then
            echo "::error::drizzle-kit generate did not complete cleanly (see log above) — treating as drift rather than trusting its exit code."
            exit 1
          fi
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema and checked-in migrations have drifted — drizzle-kit generate produced changes (tracked or untracked) that are not committed:"
            git status --porcelain drizzle
            exit 1
          fi

      # Gating is `!= 'false'`, not `== 'true'`, on purpose: select-tests.ts fails
      # OPEN everywhere, and an `== 'true'` guard would skip the step on an absent
      # or malformed output, so the job could go green having run only lint and
      # typecheck. Only the literal string `false` (which toOutputs emits only for
      # a subset with nothing of that kind to run) skips a step.
      #
      # `mode=all` runs the ordinary `npm run test`. A subset names files, read
      # into an array so that route paths like [id] are never glob-expanded.
      - name: Unit & integration tests (selected)
        if: steps.select.outputs.run_unit != 'false'
        working-directory: website
        env:
          MODE: ${{ steps.select.outputs.mode }}
          UNIT_FILES: ${{ steps.select.outputs.unit_files }}
        run: |
          if [ "$MODE" = "all" ]; then
            npm run test
          else
            read -r -a files <<< "$UNIT_FILES"
            npx vitest run "${files[@]}"
          fi

      # Everything from here to the e2e run is skipped when the selection has
      # no spec, because building and serving the app is the expensive part.
      - name: Build
        if: steps.select.outputs.run_e2e != 'false'
        working-directory: website
        env:
          NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PUBLIC_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY: ''
        run: npm run build

      - name: Install Playwright browser
        if: steps.select.outputs.run_e2e != 'false'
        working-directory: website
        run: npx playwright install --with-deps chromium

      # Still through the TLS proxy, although only Chromium runs: playwright.config.ts
      # throws in CI on a plain-HTTP BASE_URL, and this keeps the served
      # app identical to the full job's.
      - name: Generate self-signed TLS certificate
        if: steps.select.outputs.run_e2e != 'false'
        working-directory: website
        run: npm run tls:generate-cert -- .tls

      - name: Start built app
        if: steps.select.outputs.run_e2e != 'false'
        working-directory: website
        env:
          MOCK_GRADING_PROVIDER: '1'
        run: |
          npm run start -- -p 3000 &
          echo $! > /tmp/next-server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time" >&2
          exit 1

      - name: Start TLS proxy in front of the built app
        if: steps.select.outputs.run_e2e != 'false'
        working-directory: website
        env:
          TLS_PROXY_PORT: '8443'
          TLS_PROXY_TARGET_PORT: '3000'
          TLS_PROXY_CERT: .tls/localhost-cert.pem
          TLS_PROXY_KEY: .tls/localhost-key.pem
        run: |
          node scripts/tls-proxy.mjs &
          echo $! > /tmp/tls-proxy.pid
          for i in $(seq 1 30); do
            if curl -sfk https://localhost:8443 > /dev/null; then
              echo "TLS proxy is up"
              exit 0
            fi
            sleep 1
          done
          echo "TLS proxy did not become ready in time" >&2
          exit 1

      # Unlike the full job, `--project=chromium-desktop` IS named here, on
      # purpose: narrowing to one engine is what makes this smoke. `@cms`
      # specs are excluded for the same reason as in the full job. A subset
      # passes the selected spec files as filters; `all` passes none.
      - name: E2E (Playwright, selected, chromium-desktop)
        if: steps.select.outputs.run_e2e != 'false'
        working-directory: website
        env:
          BASE_URL: https://localhost:8443
          MOCK_GRADING_PROVIDER: '1'
          PLAYWRIGHT_EXTERNAL_SERVER: '1'
          MODE: ${{ steps.select.outputs.mode }}
          E2E_FILES: ${{ steps.select.outputs.e2e_files }}
        run: |
          files=()
          if [ "$MODE" != "all" ]; then
            read -r -a files <<< "$E2E_FILES"
          fi
          npx playwright test --project=chromium-desktop --grep-invert "@cms" "${files[@]}"

      - name: Stop TLS proxy
        if: always() && steps.select.outputs.run_e2e != 'false'
        run: kill "$(cat /tmp/tls-proxy.pid)" 2>/dev/null || true

      - name: Stop built app
        if: always() && steps.select.outputs.run_e2e != 'false'
        run: kill "$(cat /tmp/next-server.pid)" 2>/dev/null || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: website/playwright-report/
          retention-days: 7

  cms:
    name: CMS — install & build smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cms/package-lock.json

      - name: Install dependencies
        working-directory: cms
        run: npm ci

      - name: Build
        working-directory: cms
        run: npm run build

  grading-regression:
    # The check name is the only thing a reviewer sees. "AI grading golden-set
    # regression" going green reads as "grading was validated"; nothing is
    # called. Say so where it shows.
    name: AI grading golden-set regression (PLACEHOLDER — validates nothing yet)
    # Not on the daily schedule. The trigger scope is Irina's to decide once
    # KAN-39 makes this real (see grading-regression.yml): it starts spending
    # live API money then, and a nightly run would be "and daily" appended to a
    # set she has not chosen. The `schedule` trigger above is a full run of
    # main's own tests, not a decision to exercise the live providers.
    if: github.event_name != 'schedule'
    needs: [website]
    uses: ./.github/workflows/grading-regression.yml
    # Explicit, not `secrets: inherit`. Inherit exposed GCP_SA_KEY_BASE64,
    # STRIPE_SECRET_KEY and the STRAPI_* signing secrets to a called workflow
    # on every PR run, pre-merge.
    secrets:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
