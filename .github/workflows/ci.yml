name: CI

# Fast suite gating every PR and every push to main (Ways of Working §6,
# Test Strategy §7): install -> lint -> typecheck -> unit/integration tests
# (against an ephemeral Postgres) -> build -> funnel e2e (mocked grading
# provider) -> the real-provider AI-grading golden-set regression check.
# deploy-website.yml / deploy-cms.yml require a successful run of this
# workflow for the commit being deployed before they'll run.

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'cms/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/grading-regression.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'cms/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/grading-regression.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website — lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fluentina
          POSTGRES_USER: fluentina
          POSTGRES_PASSWORD: fluentina_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluentina -d fluentina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://fluentina:fluentina_ci@localhost:5432/fluentina
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Lint
        working-directory: website
        run: npm run lint

      - name: Typecheck
        working-directory: website
        run: npm run typecheck

      - name: Unit & integration tests
        working-directory: website
        # Vitest — includes the security/ownership/consent/rate-limit
        # integration suite (Test Strategy §4) once those stories land, run
        # against the Postgres service container above, never a shared DB.
        run: npm run test

      - name: Build
        working-directory: website
        env:
          NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PUBLIC_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY: ''
        run: npm run build

      - name: Install Playwright browsers
        working-directory: website
        # Desktop + mobile Chromium only in CI (Test Strategy §5) — WebKit
        # stays available locally via `npm run test:e2e` but isn't required
        # to gate every PR.
        run: npx playwright install --with-deps chromium

      - name: Start built app
        working-directory: website
        run: |
          npm run start -- -p 3000 &
          echo $! > /tmp/next-server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time" >&2
          exit 1

      - name: Funnel e2e (mocked grading provider)
        working-directory: website
        env:
          BASE_URL: http://localhost:3000
          # Flag for the guest-funnel specs (KAN-14 onward) to intercept
          # grading calls instead of hitting Mistral/Claude — see Test
          # Strategy §5. No-op today: the funnel doesn't exist in code yet.
          MOCK_GRADING_PROVIDER: '1'
        run: npx playwright test --project=chromium-desktop --project=chromium-mobile

      - name: Stop built app
        if: always()
        run: kill "$(cat /tmp/next-server.pid)" 2>/dev/null || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 7

  cms:
    name: CMS — install & build smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cms/package-lock.json

      - name: Install dependencies
        working-directory: cms
        run: npm ci

      - name: Build
        working-directory: cms
        run: npm run build

  grading-regression:
    name: AI grading golden-set regression
    needs: [website]
    uses: ./.github/workflows/grading-regression.yml
    secrets: inherit
