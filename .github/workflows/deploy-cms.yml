name: Deploy CMS to Cloud Run

# Deployment is a separate, deliberate action from merging (Ways of Working
# §6) — deliberately NOT triggered by push to main. Run manually via
# workflow_dispatch once main is ready to ship. The verify-ci job below
# requires ci.yml to have already passed for the commit being deployed
# before gcloud run deploy runs.
#
# NOTE: the intended control here is a GitHub Environment with required
# reviewers (a real approval gate). This repo's automation token only has
# Contents + Pull Requests scope, not Administration, so Settings ->
# Environments could not be configured from this session — see PR
# description / delivery report. The verify-ci job is the best available
# substitute given that constraint: it blocks the deploy job, but doesn't
# require a human click the way an Environment gate would.
on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: writewise-468912
  GCP_REGION: europe-west10
  SERVICE_NAME: writewise-cms
  CLOUD_SQL_INSTANCE: writewise-468912:europe-west10:writewise-db

jobs:
  verify-ci:
    name: Verify main, and that ci.yml passed for this commit
    runs-on: ubuntu-latest
    # workflow_dispatch accepts ANY ref. Without this, a feature branch whose
    # PR had passed CI satisfied the SHA check below, and actions/checkout in
    # the deploy job would then ship that unmerged branch to production.
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
    steps:
      - name: Check for a successful ci.yml run on this SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: sha,
              status: 'completed',
            });
            // A pull_request run reports the PR branch tip as head_sha, so a
            // SHA match alone does not mean CI passed for this commit ON main.
            // Require a push-event run on main.
            const ok = data.workflow_runs.find(
              r => r.conclusion === 'success' &&
                   r.event === 'push' &&
                   r.head_branch === 'main'
            );
            if (!ok) {
              const seen = data.workflow_runs
                .map(r => `${r.event}/${r.head_branch}: ${r.conclusion}`)
                .join(', ') || 'none';
              core.setFailed(
                `No successful push-to-main ci.yml run found for commit ${sha}. ` +
                `Deploys require ci.yml to pass for the exact commit being ` +
                `deployed (Ways of Working §6 / Test Strategy §7). ` +
                `Runs seen for this SHA: ${seen}.`
              );
            } else {
              core.info(`ci.yml passed on main for ${sha}: ${ok.html_url}`);
            }

  deploy:
    name: Deploy CMS to Production
    needs: verify-ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        run: |
          # Remove any whitespace and decode base64
          echo "${{ secrets.GCP_SA_KEY_BASE64 }}" | tr -d '[:space:]' | base64 -d > $HOME/gcp-key.json
          gcloud auth activate-service-account --key-file=$HOME/gcp-key.json
          gcloud config set project ${{ env.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          # Configure Docker to use gcloud as credential helper
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

          # Build Docker image from cms/ directory
          cd cms
          docker build -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/writewise/${{ env.SERVICE_NAME }}:${{ github.sha }} \
                       -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/writewise/${{ env.SERVICE_NAME }}:latest .

          # Push Docker image
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/writewise/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/writewise/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/writewise/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 300 \
            --port 1337 \
            --set-env-vars "NODE_ENV=production,DATABASE_CLIENT=postgres,DATABASE_NAME=writewise,DATABASE_USERNAME=writewise,DATABASE_SCHEMA=cms,DATABASE_HOST=/cloudsql/${{ env.CLOUD_SQL_INSTANCE }},DATABASE_PORT=5432,HOST=0.0.0.0,APP_KEYS=${{ secrets.STRAPI_APP_KEYS }},API_TOKEN_SALT=${{ secrets.STRAPI_API_TOKEN_SALT }},ADMIN_JWT_SECRET=${{ secrets.STRAPI_ADMIN_JWT_SECRET }},TRANSFER_TOKEN_SALT=${{ secrets.STRAPI_TRANSFER_TOKEN_SALT }},JWT_SECRET=${{ secrets.STRAPI_JWT_SECRET }},STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }},MAILJET_API_KEY=${{ secrets.MAILJET_API_KEY }},MAILJET_SECRET_KEY=${{ secrets.MAILJET_SECRET_KEY }},SUPPORT_EMAIL=support@fluentina.com,GCS_BUCKET_NAME=writewise-cms-media,MAILJET_PLACEMENT_TEST_LIST_ID=10537779,WRITEWISE_APP_URL=https://app.fluentina.com" \
            --set-secrets "DATABASE_PASSWORD=db-password:latest" \
            --set-secrets "/secrets/gcs-service-account=strapi-gcs-service-account:latest" \
            --add-cloudsql-instances ${{ env.CLOUD_SQL_INSTANCE }}

          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --format 'value(status.url)')

          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $SERVICE_URL"

      - name: Test deployment
        run: |
          sleep 15
          curl -f ${{ steps.deploy.outputs.url }}/_health || echo "Health check failed (expected - endpoint might not exist yet)"
          echo "✅ CMS deployment successful!"

      - name: Create deployment summary
        run: |
          echo "## 🚀 CMS Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin Panel:** ${{ steps.deploy.outputs.url }}/admin" >> $GITHUB_STEP_SUMMARY
          echo "- **Git SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💰 Cost Optimization:" >> $GITHUB_STEP_SUMMARY
          echo "CMS scales to 0 when not in use (min-instances: 0)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Access admin panel: ${{ steps.deploy.outputs.url }}/admin" >> $GITHUB_STEP_SUMMARY
          echo "2. Create admin user if first deployment" >> $GITHUB_STEP_SUMMARY
          echo "3. Configure API permissions in Strapi admin" >> $GITHUB_STEP_SUMMARY
          echo "4. Test API endpoints" >> $GITHUB_STEP_SUMMARY
