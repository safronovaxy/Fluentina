name: AI Grading Golden-Set Regression

# Runs the golden essay-set + structural-invariant harness against the real
# Mistral/Claude provider (Test Strategy §3). Per Irina's round-2 direction
# (Test Strategy §7, finalized 2026-09-11): this gates every deployment by
# running on every PR and every push to main as part of ci.yml — not on a
# separate schedule, and not gated to prompt/grading-provider paths only.
# At the expected deploy cadence (~10 pre-launch, 2-3/week after), running it
# on every push already catches silent upstream model drift at least as
# often as a weekly cron would, so no cron job is added.
#
# workflow_call: invoked as a required job from ci.yml on every run.
# workflow_dispatch: lets anyone run it on demand outside that flow.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  golden-set-regression:
    name: Golden-set regression (real provider)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Run golden-set regression against real provider
        working-directory: website
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if npm run 2>/dev/null | grep -q "test:grading-regression"; then
            npm run test:grading-regression
          else
            echo "::notice title=Golden-set harness not built yet::The GradingProvider abstraction, prompt template, and golden essay set (KAN-4/KAN-16, Architecture Decisions ADR-4/ADR-5) don't exist in the repo yet, so there's nothing to run against the real provider."
            echo "::notice::This job becomes a real, deployment-gating check the moment an npm script named 'test:grading-regression' exists in website/package.json implementing Test Strategy §3.1-3.4 (structural invariants + directional golden-set assertions + baseline-diff tolerance)."
          fi
