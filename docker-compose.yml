## Local development infrastructure only — never used in production.
## Production runs on the existing shared Cloud SQL Postgres instance
## (see Architecture Decisions ADR-1/ADR-10 on Confluence, MFS space).
##
## Usage:
##   docker compose up -d db
##   psql postgres://fluentina:fluentina_dev@localhost:55432/fluentina
##
## This gives every developer (including non-engineers checking out `main`
## per the Ways of Working page) an isolated local database that can never
## touch real guest data.

services:
  db:
    # Pinned to an exact version, not the floating `16` tag, so local and CI
    # cannot silently diverge from each other. The major must match
    # EXPECTED_POSTGRES_MAJOR in website/src/lib/db/postgres-version.ts,
    # which the migration runner asserts against the live server.
    image: postgres:16.10-alpine
    container_name: fluentina-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluentina
      POSTGRES_USER: fluentina
      POSTGRES_PASSWORD: fluentina_dev
    ports:
      # Deliberately not 5432: that is where cloud-sql-proxy conventionally
      # listens, and having both meant either a bind failure or an app
      # pointed at production while believing it was local.
      - '55432:5432'
    volumes:
      - fluentina-db-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fluentina -d fluentina']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fluentina-db-dev-data:
